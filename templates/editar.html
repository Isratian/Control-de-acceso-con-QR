<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Vehículo - Control de Acceso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="/static/logo.jpg" type="image/jpeg">
</head>
<body class="bg-gray-100 min-h-screen p-6 flex items-center justify-center">
    <div class="max-w-2xl w-full bg-white p-8 rounded-lg shadow-md border">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">Editar Registro (ID: {{ vehiculo[0] }})</h1>
        
        <form action="/actualizar/{{ vehiculo[0] }}" method="POST">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Vehículo / Marca</label>
                    <input type="text" name="tipo_vehiculo" value="{{ vehiculo[1] }}" required 
                           class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Placa</label>
                    <input type="text" name="placa" value="{{ vehiculo[2] }}" required 
                           oninput="this.value = this.value.toUpperCase()"
                           class="w-full border rounded-lg p-2 uppercase focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Color</label>
                    <input type="text" name="color" value="{{ vehiculo[3] }}" required 
                           class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Unidad Policial / Dependencia</label>
                    <input type="text" name="unidad" value="{{ vehiculo[4] }}" required 
                           class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">SGOP (Grado y Nombre)</label>
                    <input type="text" name="sgop" value="{{ vehiculo[5] }}" 
                           class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">N° Estacionamiento</label>
                    <input type="text" name="num_estacionamiento" value="{{ vehiculo[6] }}" required 
                           class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Teléfono</label>
                    <input type="text" name="telefono" value="{{ vehiculo[7] }}" 
                           class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <div class="flex space-x-4">
                <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition duration-200">
                    Guardar Cambios
                </button>
                <a href="/" class="flex-1 bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded-lg text-center transition duration-200">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</body>
</html>
